# Configuration Cloudflare Workers & Base de données D1 pour Instant Météo
name = "instant-meteo-d1-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Définition de la liaison (binding) vers la base de données SQL Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "meteo-competitive-db"
database_id = "METTEZ_ICI_L_ID_OBTENU_AVEC_WRANGLER_D1_CREATE"
