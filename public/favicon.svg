<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Luminous Sky & Sunrise Gradient -->
    <linearGradient id="brightSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Glassmorphic Rim Gradient -->
    <linearGradient id="brightRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radiant Golden Sun Gradient -->
    <radialGradient id="positiveSunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <!-- Warm Solar Corona Glow -->
    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Fluffy Positive Cloud Gradient -->
    <linearGradient id="positiveCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Soft Cloud Rim Highlight -->
    <linearGradient id="cloudRimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Cheerful Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Dynamic Lightning / Instant Energy Bolt -->
    <linearGradient id="energyBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadows -->
    <filter id="cloudSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.3"/>
    </filter>

    <filter id="sunSoftShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>

    <filter id="boltPopShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c2410c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Bright Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#brightSkyGrad)"/>
  
  <!-- Subtle Internal Glow Shimmer -->
  <ellipse cx="256" cy="120" rx="200" ry="100" fill="#ffffff" fill-opacity="0.2" filter="blur(20px)"/>

  <!-- High-Gloss Glass Rim Border -->
  <rect width="496" height="496" x="8" y="8" rx="118" fill="none" stroke="url(#brightRimGrad)" stroke-width="5"/>
  <rect width="484" height="484" x="14" y="14" rx="112" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Cheerful Ambient Sunlight Glow Rings -->
  <circle cx="340" cy="165" r="130" fill="url(#sunCorona)"/>
  <circle cx="340" cy="165" r="95" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Radiant Big Friendly Sun (Top-Right) -->
  <g filter="url(#sunSoftShadow)">
    <circle cx="340" cy="165" r="62" fill="url(#positiveSunGrad)"/>
    
    <!-- Warm Smiling Sunbeams (Rounded & Joyful) -->
    <!-- Cardinal rays -->
    <rect x="334" y="74" width="12" height="22" rx="6" fill="#ffffff"/>
    <rect x="334" y="234" width="12" height="22" rx="6" fill="#fde047"/>
    <rect x="249" y="159" width="22" height="12" rx="6" fill="#ffffff"/>
    <rect x="409" y="159" width="22" height="12" rx="6" fill="#fde047"/>
    
    <!-- Diagonal rays -->
    <g transform="rotate(45, 340, 165)">
      <rect x="334" y="74" width="12" height="20" rx="6" fill="#ffffff"/>
      <rect x="334" y="236" width="12" height="20" rx="6" fill="#fde047"/>
      <rect x="249" y="159" width="20" height="12" rx="6" fill="#fde047"/>
      <rect x="411" y="159" width="20" height="12" rx="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- Cheerful Weather Sparkles / Stars (Positive Vibe) -->
  <g filter="url(#boltPopShadow)">
    <!-- Top-left sparkle -->
    <path d="M120 130 Q120 155 95 155 Q120 155 120 180 Q120 155 145 155 Q120 155 120 130 Z" fill="url(#sparkleGrad)"/>
    <!-- Small accent sparkle -->
    <path d="M175 105 Q175 120 160 120 Q175 120 175 135 Q175 120 190 120 Q175 120 175 105 Z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Bottom-right tiny star -->
    <path d="M420 360 Q420 375 405 375 Q420 375 420 390 Q420 375 435 375 Q420 375 420 360 Z" fill="url(#sparkleGrad)"/>
  </g>

  <!-- Friendly, Fluffy, Sculpted Bright Cloud (Foreground) -->
  <g filter="url(#cloudSoftShadow)">
    <!-- Main Cloud Silhouette -->
    <path d="M180 365 H345 C388 365 418 332 410 292 C404 258 374 234 340 234 C335 234 330 235 325 237 C310 188 266 156 215 158 C164 160 123 198 116 248 C112 248 108 248 104 248 C66 248 38 278 38 316 C38 346 58 365 88 365 Z" 
          fill="url(#positiveCloudGrad)"/>
    
    <!-- Top Cloud Highlight (Soft Crisp Light Rim) -->
    <path d="M180 365 H345 C388 365 418 332 410 292 C404 258 374 234 340 234 C335 234 330 235 325 237 C310 188 266 156 215 158 C164 160 123 198 116 248 C112 248 108 248 104 248 C66 248 38 278 38 316 C38 346 58 365 88 365 Z" 
          fill="none" stroke="url(#cloudRimLight)" stroke-width="4.5"/>
  </g>

  <!-- Playful & Energetic Instant Flash Bolt -->
  <g filter="url(#boltPopShadow)">
    <polygon points="270,315 238,375 264,375 235,445 288,360 260,360" 
             fill="url(#energyBoltGrad)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
