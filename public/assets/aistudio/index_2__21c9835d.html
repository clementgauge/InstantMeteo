<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030913">
<title>Instant Météo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="icon">
      <!-- Cadre néon -->
      <svg class="frame" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8fd8ff"/>
            <stop offset=".5" stop-color="#2f86ff"/>
            <stop offset="1" stop-color="#7fe3ff"/>
          </linearGradient>
        </defs>
        <rect class="line base" x="20" y="20" width="160" height="160" rx="48" pathLength="1"/>
        <rect class="line comet" x="20" y="20" width="160" height="160" rx="48" pathLength="1"/>
      </svg>

      <!-- Pictogramme météo -->
      <svg class="glyph" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="sun" cx="40" cy="38" r="13"/>
        <g class="rays">
          <path d="M40 14v6M40 56v6M16 38h6M58 38h6M23 21l4 4M57 55l4 4M23 55l4-4M57 21l4-4"/>
        </g>
        <path class="cloud" d="M34 72h38a12 12 0 0 0 1.5-23.9A17 17 0 0 0 41 52a10 10 0 0 0-7 20z"/>
      </svg>
    </div>

    <h1 class="title" aria-label="Instant Météo"></h1>
    <p class="tag">La météo, à l'instant</p>
  </main>

  <button class="replay" id="replay" type="button">Rejouer ↻</button>
  <script src="script.js"></script>
</body>
</html>
