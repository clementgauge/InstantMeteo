name: Deploy Instant Météo to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCED_NODE_VERSION: node24

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend application (Vite, Tailwind, Prerender SEO)
        run: npm run build

      - name: Deploy to Cloudflare Workers (Static Assets & D1)
        run: npx wrangler deploy --name instantmeteo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
