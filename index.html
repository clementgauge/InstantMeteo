    <!-- Synchronisation immédiate de l'URL canonique avant hydratation -->
    <script>
      (function() {
        try {
          var origin = 'https://instantmeteo.instantmeteofr.workers.dev';
          var rawPath = window.location.pathname || '/';
          var cleanPath = rawPath.length > 1 && rawPath.endsWith('/') ? rawPath.slice(0, -1) : rawPath;
          var canonicalHref = cleanPath === '/' ? origin + '/' : origin + cleanPath;
          var link = document.getElementById('dynamic-canonical-link');
          if (link) {
            link.setAttribute('href', canonicalHref);
          }
        } catch (e) {}
      })();
    </script>

    <script>

      window.__deferredPwaPrompt = null;

        window.dispatchEvent(new CustomEvent('instant_meteo_pwa_ready', { detail: e }));

      if ('serviceWorker' in navigator) {

    </script>

    <!-- Instant Theme Initializer -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('instant_meteo_display_preferences');
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs && prefs.colorTheme === 'light') {
              document.documentElement.classList.add('theme-light');
              document.documentElement.classList.remove('theme-dark');
              return;
            }
          }
          document.documentElement.classList.add('theme-dark');
          document.documentElement.classList.remove('theme-light');
        } catch (e) {}
      })();
    </script>
